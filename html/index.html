<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot UI</title>

    <style>
      *{
        margin: 0;
        padding: 0;
      }
      body {
        background-image: radial-gradient(ellipse at bottom, #192552, #0f0d1d);
        background-repeat: no-repeat;
        height: 100vh;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      } 

      
      /* nanti ini enable lagi, soalnya ngerusak intelsense */
      @property --angle{
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }
      @keyframes spin{
        from{
          --angle:0deg;
        }
        to{
          --angle:360deg;
        }
      }
      #chatboxContainer{
        margin: 10px;
        padding: 1em;
        border-radius: 1.5em;
        background-color: #0f0d1d;
        position: absolute;
      }
      #chatboxContainer::after,#chatboxContainer::before {
        --borderThickness:2px;
        content: '';
        position: absolute;
        height: 100%;
        width: 100%;
        background-image: conic-gradient(from var(--angle),#192552 110deg,#3d67ff,#a3b7ff,#3d67ff,#192552 );
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        z-index: -1;
        padding: var(--borderThickness);
        border-radius: calc(1.5em + var(--borderThickness));
        animation: 3s spin linear infinite;
      }
      #chatboxContainer::before{
        filter: blur(0.5em);
        opacity: 50%;
      }

      
      #sendButton{
        border-radius: 100vh;
        background-color: #090710;
        /* background-color: transparent; */
        padding: 0.5em;
        transition: background-color 0.3s;
        width: 1em;
        height: 1em;
      }
      #sendButton:hover{
        background-color: #09071000;
      }
      #sendButtonBorder{
        height: fit-content;
        --borderThickness:2px;
        /* background-image: linear-gradient(var(--angle) , #3d67ff,#a3ddff); */
        background-image: linear-gradient(var(--angle) , #3d67ff,#a3ddff);
        border-radius: 100vh;
        animation: 3s spin linear infinite;
        padding: 2px;
      }
      #sendIcon{
        width: 1em;
      }

      #chatInput{
        padding: 0 1em 0 0;
        color: white;
        /* background-color: black; */
        border: none;
        width: 20em;
      }
      #chatInput:focus {
        outline: none;
        box-shadow: none;
      }

      #chatInputPlaceholderContainer{
        position: absolute;
        width: 100%;
        pointer-events: none;
        user-select: none; /* optional, just in case */
      }
      #chatInputPlaceholder{
        padding: 1em;
        color: #ffffff88;
      }

      
      .centeredFlex{
        display: flex;
        align-items: center;
        justify-content: center;
        /* gap: 1em; */
      }
      #chatboxContainerMock{
        height: 3em;
        width: 1px;
      }

      #chatHistory{
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: height 0.5s;
        max-height: 80vh;
        overflow-y: hidden;
      }
      .message{
          border: 1px solid #3d67ff;
          padding: 5px 10px;
          text-align: left;
          color: #fff;
          max-width: 17em;
          word-wrap: break-word;
          /* height: auto; */
          white-space: pre-wrap;
      }
      .userMessage{
          background-color: #0f0d1d ;

          border-radius: 10px 10px 0 10px; 
          margin: 0 0 0 auto;
          align-self: flex-end;
      }
      .aiMessage{
          background-image: linear-gradient(155deg , #3d67ff,#192552 );

          border-radius: 10px 10px 10px 0;
          margin: 0 auto 0 0 ;
      }

    </style>
</head>
<body>
  <!-- <div id="a">a
    <div id="c">
      <input type="text" value="test" id="chatbox"><input type="button" id="sendButton" value=">"></div>
  </div>
  
  <div id="b">b</div> -->

    <div id="chatboxContainer">
      <div id="chatHistory">
        <!-- <div class="userMessage message">Hello</div>
        <div class="aiMessage message">Hi</div> -->
      </div>
      <div class="centeredFlex">
        <div id="chatInputPlaceholderContainer"> <div id="chatInputPlaceholder">What would you like to know about IDE Asia ?</div></div>
        <div id="chatInput" contenteditable="true"></div>
        <div id="sendButtonBorder"><div id="sendButton">
          <img src="send-symbol.svg" alt="send" id="sendIcon">
        </div></div>
      </div>
    </div>
  </div>
</body>
<script>
  const chatInput = document.getElementById("chatInput")
  const chatInputPlaceholder = document.getElementById("chatInputPlaceholder")
  chatInput.addEventListener("input", () => {
    chatInputPlaceholder.hidden = chatInput.textContent != "";
  });
  chatInput.addEventListener("keydown", (pressed) => {
  if (pressed.key === "Enter") {
    // Allow Shift+Enter to create a new line
    if (pressed.shiftKey) return;

    pressed.preventDefault(); // stop line break
    sendButton.onclick()
  }
});

  let messagesHistory   = [];
  const sendButton      = document.getElementById("sendButton");
  const chatHistoryDiv  = document.getElementById("chatHistory");

  function addNewMessage(message){
    
    const messageDiv        = document.createElement("div");
    messageDiv.className    = message.role=="assistant"?"aiMessage message":"userMessage message";
    messageDiv.textContent  = message.content;
    
    console.log("messageDiv.textContent = "+messageDiv.textContent)
    
    const prevChatHistoryDivHeight = getComputedStyle(chatHistoryDiv).height;
    chatHistoryDiv.style.height="auto";

    chatHistoryDiv.appendChild(messageDiv);

    const nextChatHistoryDivHeight = getComputedStyle(chatHistoryDiv).height;
    chatHistoryDiv.style.height=prevChatHistoryDivHeight;
    setTimeout(() => {
      chatHistoryDiv.style.height=nextChatHistoryDivHeight;
    }, 100);
    
    setTimeout(() => {
      /* scrollToEnd */
      chatHistoryDiv.scrollTop = chatHistoryDiv.scrollHeight;
    }, 500);
    return messageDiv;
  }

  sendButton.onclick = () => {
    chatHistoryDiv.style.paddingBottom = "10px"
    chatInputPlaceholder.hidden = false
    // sendButton.classList.add = "disabled";
    sendButton.disabled = true;
    const userNewMessageContent = chatInput.textContent;
    console.log("userNewMessageContent = "+userNewMessageContent)
    const userNewMessage        = {'role': 'user', 'content': userNewMessageContent};

    chatInput.textContent = "";

    addNewMessage(userNewMessage)
    messagesHistory.push(userNewMessage);
    chatInputPlaceholder.textContent = "Please Wait...";

    // assistantTyping = addNewMessage ({'role': 'assistant', 'content': '...'})
    fetch(
      "/getBotResponse",{
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messagesHistory
      })
    })
    .then(
      response => response.json()
    ).then(botReply => {
      // console.log(botReply)
      sendButton.disabled = false;
      
      const botNewMessage = {'role': 'assistant', 'content': botReply};
      
      // chatHistory.removeChild(assistantTyping);
      addNewMessage (botNewMessage)
      messagesHistory.push(botNewMessage);
    })
    .catch(error => {
      // chatHistory.removeChild(assistantTyping);
      addNewMessage ({'role': 'assistant', 'content': "Im so sorry, My system is currently down. Please try again later"})
      console.error("Error fetching bot response:", error);
    })
    .finally(()=>{
      chatInputPlaceholder.textContent = "What would you like to know about IDE Asia ?";
    });
  }
</script>
</html>
